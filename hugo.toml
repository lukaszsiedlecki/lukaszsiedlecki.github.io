baseurl = "https://lukaszsiedlecki.com"
title = "Łukasz Siedlecki"
theme = "PaperMod"
languagecode = "en"
defaultcontentlanguage = "en"

[pagination]
pagerSize = 20

[frontmatter]
lastmod = ["lastmod", "date"]

[markup.highlight]
style = "github-dark"

[params]
author = "Łukasz Siedlecki"
description = "Łukasz Siedlecki's personal website"
